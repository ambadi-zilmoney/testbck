# Backend stack for https://api.example.com
#
#   nginx on the host (HTTPS via Let's Encrypt, load balancing, retries)
#     ├─► 127.0.0.1:8081  backend-a ─┐
#     └─► 127.0.0.1:8082  backend-b ─┴─► MySQL ◄── db-backup (daily dumps)
#
# The React frontend is hosted separately on S3 + CloudFront (https://example.com).
# Usage:  cp .env.example .env  &&  docker compose up -d --build
# nginx + certificate (one time):  sudo ./scripts/setup-nginx.sh api.example.com example.com you@example.com
# Zero-downtime redeploy:  ./scripts/deploy-backend.sh
name: php-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared definition for both API replicas
x-backend: &backend
  build: .
  image: ${REGISTRY:-local}/php-api:${TAG:-latest}
  restart: unless-stopped
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: "3306"
    DB_NAME: ${DB_NAME:-app}
    DB_USER: ${DB_USER:-app}
    DB_PASSWORD: ${DB_PASSWORD}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}
    RUN_MIGRATIONS: "true"   # both replicas may run it; a DB lock makes that safe
  depends_on:
    db:
      condition: service_healthy
  networks: [public, internal]
  logging: *default-logging
  stop_grace_period: 30s     # let in-flight requests finish (Apache stops gracefully)
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

services:
  # Ports are bound to 127.0.0.1 only: the host's nginx (HTTPS) is the public entry point.
  backend-a:
    <<: *backend
    ports:
      - "127.0.0.1:8081:8080"

  backend-b:
    <<: *backend
    ports:
      - "127.0.0.1:8082:8080"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  db-backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/db-backup.sh"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-app}
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

# The API replicas are reachable only from the host (127.0.0.1). MySQL sits on an internal-only network.
networks:
  public:
  internal:
    internal: true

volumes:
  db-data:
