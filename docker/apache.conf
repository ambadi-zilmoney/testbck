ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Skip health-check noise in the access log
SetEnvIf Request_URI "^/api/(health|ready)$" dontlog

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Front controller: route everything that isn't a real file to index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Never serve dotfiles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
