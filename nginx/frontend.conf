# nginx site for the React frontend: https://__FRONTEND_DOMAIN__
# Installed by scripts/setup-nginx.sh, which replaces __FRONTEND_DOMAIN__.
# Files live in /var/www/__FRONTEND_DOMAIN__/current (a symlink to the latest release,
# switched atomically by the frontend's deploy-server script).

# ---- HTTP: Let's Encrypt challenges + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __FRONTEND_DOMAIN__ www.__FRONTEND_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__FRONTEND_DOMAIN__$request_uri;
    }
}

# ---- www -> apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__FRONTEND_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__FRONTEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FRONTEND_DOMAIN__/privkey.pem;

    return 301 https://__FRONTEND_DOMAIN__$request_uri;
}

# ---- HTTPS: the site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __FRONTEND_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__FRONTEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FRONTEND_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/__FRONTEND_DOMAIN__/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (repeated in locations that set their own add_header, since nginx
    # drops inherited add_header directives there)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://__API_DOMAIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/frontend.access.log;
    error_log  /var/log/nginx/frontend.error.log warn;

    # Vite fingerprints these files, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html is never cached, so each deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://__API_DOMAIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # SPA fallback: unknown paths serve index.html so client-side routes work
    location / {
        try_files $uri $uri/ /index.html;
    }
}
