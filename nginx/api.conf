# nginx site for the API: https://__API_DOMAIN__
# Installed by scripts/setup-nginx.sh, which replaces __API_DOMAIN__ / __FRONTEND_DOMAIN__.
# TLS certificates come from Let's Encrypt (certbot) and renew automatically.

# The two Docker API replicas (published on localhost only, see docker-compose.yml).
# A replica that fails 3 times is skipped for 30s; requests go to the other one.
upstream php_api {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Frontend origins allowed to read error responses generated by nginx itself.
# (Normal API responses get their CORS headers from PHP: CORS_ALLOWED_ORIGINS.)
map $http_origin $api_cors_origin {
    default                              "";
    "https://__FRONTEND_DOMAIN__"        $http_origin;
    "https://www.__FRONTEND_DOMAIN__"    $http_origin;
}

# ---- HTTP: Let's Encrypt challenges + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the API ----
server {
    # "listen ... http2" works on the nginx versions shipped by Ubuntu 22.04/24.04
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;

    location /api/ {
        proxy_pass http://php_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # If a replica is down or times out, retry the request on the other one.
        # (nginx never re-sends a POST that already reached a replica.)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Both replicas unreachable -> JSON error the frontend can read (see @api_down)
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        add_header Access-Control-Allow-Origin $api_cors_origin always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Vary "Origin" always;
        add_header Retry-After "10" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Not Found"}';
    }
}
